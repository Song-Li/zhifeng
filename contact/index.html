<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系我们 — 智锋安全 Bladesec</title>
<meta name="description" content="申请智锋安全产品演示、获取行业解决方案或进行商务合作交流。">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<nav class="nav">
  <div class="container">
    <a href="/" class="nav-brand"><img src="../assets/images/logo.png" alt="智锋安全 Bladesec"></a>
    <ul class="nav-links">
      <li><a href="/">首页</a></li>
      <li><a href="/products/">产品</a></li>
      <li><a href="/solutions/">方案</a></li>
      <li><a href="/about/">团队</a></li>
      <li><a href="/contact/" class="nav-cta active">申请演示</a></li>
    </ul>
    <button class="nav-toggle" aria-label="菜单">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
</nav>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="../">首页</a> <span>/</span> <span>联系我们</span></div>
    <h1 class="page-header-title">申请演示或行业方案交流</h1>
    <p class="page-header-desc">让智锋安全帮助您的组织构建面向 AI 时代的内部安全能力。</p>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="container">
    <div style="max-width:600px;margin:0 auto;">
      <div class="card" style="padding:40px;">
        <form id="contact-form" style="display:flex;flex-direction:column;gap:20px;">
          <div>
            <label style="display:block;font-size:0.88rem;font-weight:600;color:var(--color-text);margin-bottom:6px;">姓名</label>
            <input type="text" placeholder="您的姓名" style="width:100%;padding:10px 14px;border:1px solid var(--color-border);border-radius:6px;font-size:0.95rem;font-family:inherit;color:var(--color-text);outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'">
          </div>
          <div>
            <label style="display:block;font-size:0.88rem;font-weight:600;color:var(--color-text);margin-bottom:6px;">单位</label>
            <input type="text" placeholder="您的单位名称" style="width:100%;padding:10px 14px;border:1px solid var(--color-border);border-radius:6px;font-size:0.95rem;font-family:inherit;color:var(--color-text);outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'">
          </div>
          <div>
            <label style="display:block;font-size:0.88rem;font-weight:600;color:var(--color-text);margin-bottom:6px;">邮箱</label>
            <input type="email" placeholder="your@email.com" style="width:100%;padding:10px 14px;border:1px solid var(--color-border);border-radius:6px;font-size:0.95rem;font-family:inherit;color:var(--color-text);outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'">
          </div>
          <div>
            <label style="display:block;font-size:0.88rem;font-weight:600;color:var(--color-text);margin-bottom:6px;">关注方向</label>
            <select style="width:100%;padding:10px 14px;border:1px solid var(--color-border);border-radius:6px;font-size:0.95rem;font-family:inherit;color:var(--color-text);outline:none;background:#fff;transition:border-color 0.2s;" onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'">
              <option value="">请选择</option>
              <option>漏洞挖掘（洞锋）</option>
              <option>渗透验证（渗锋）</option>
              <option>自适应防御（御锋）</option>
              <option>智能体安全（AgentGuard）</option>
              <option>综合方案咨询</option>
              <option>商务合作</option>
              <option>其他</option>
            </select>
          </div>
          <div>
            <label style="display:block;font-size:0.88rem;font-weight:600;color:var(--color-text);margin-bottom:6px;">留言</label>
            <textarea rows="4" placeholder="请描述您的需求和关注场景" style="width:100%;padding:10px 14px;border:1px solid var(--color-border);border-radius:6px;font-size:0.95rem;font-family:inherit;color:var(--color-text);outline:none;resize:vertical;transition:border-color 0.2s;" onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;">提交咨询</button>
        </form>
      </div>

      <div style="margin-top:40px;text-align:center;">
        <h3 style="font-size:1.15rem;font-weight:700;color:var(--color-text);margin-bottom:8px;">直接联系</h3>
        <p style="font-size:0.95rem;color:var(--color-text-secondary);">邮箱：<a href="mailto:contact@bladesec.ai">contact@bladesec.ai</a></p>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <a href="/" class="footer-brand"><img src="../assets/images/logo-white.png" alt="智锋安全"></a>
    <div class="footer-links">
      <a href="../products/">产品</a>
      <a href="../solutions/">方案</a>
      <a href="../about/">团队</a>
      <a href="../contact/">联系我们</a>
    </div>
  </div>
  <div class="footer-bottom">
    <div class="container">&copy; 2026 智锋安全 Bladesec. 自主可控的 AI 原生安全基础设施。</div>
  </div>
</footer>

<script src="../assets/js/main.js"></script>
</body>
</html>
